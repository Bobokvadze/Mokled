</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <div class="page-header">
      <div class="breadcrumb"><a href="index.html">მთავარი</a> / ხელსაწყოები</div>
      <h1>პაროლის გენერატორი</h1>
      <p>
        შექმენით ძლიერი, შემთხვევითი პაროლი. პაროლი იქმნება თქვენს ბრაუზერში კრიპტოგრაფიულად უსაფრთხო გენერატორით და არსად იგზავნება ან ინახება.
      </p>
    </div>

    <section class="panel">
      <div id="pw-error" class="alert alert-error hidden" role="alert"></div>

      <div class="alert alert-info">
        <div class="password-output" id="pw-output" aria-live="polite">-</div>
        <div class="strength-bar" aria-hidden="true"><span id="pw-bar"></span></div>
        <div style="margin-top: 0.4rem; font-size: 0.9rem;" id="pw-strength">-</div>
      </div>

      <div class="btn-row">
        <button type="button" id="btn-pw-copy" class="btn btn-primary">📋 კოპირება</button>
        <button type="button" id="btn-pw-new" class="btn btn-secondary">🔄 ახალი პაროლი</button>
      </div>

      <div class="grid-2" style="margin-top: 1rem;">
        <div class="form-group">
          <label class="form-label" for="pw-length">სიგრძე: <strong id="pw-length-val">16</strong></label>
          <input type="range" id="pw-length" min="6" max="64" value="16" style="width: 100%;" />
        </div>
        <div class="form-group">
          <label class="form-label" for="pw-count">რამდენი პაროლი:</label>
          <select id="pw-count" class="input">
            <option value="1" selected>1</option>
            <option value="5">5</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
      <div class="grid-3">
        <label class="checkbox-label"><input type="checkbox" id="pw-lower" checked /> <span>პატარა ასოები (a-z)</span></label>
        <label class="checkbox-label"><input type="checkbox" id="pw-upper" checked /> <span>დიდი ასოები (A-Z)</span></label>
        <label class="checkbox-label"><input type="checkbox" id="pw-digits" checked /> <span>ციფრები (0-9)</span></label>
        <label class="checkbox-label"><input type="checkbox" id="pw-symbols" checked /> <span>სიმბოლოები (!@#$...)</span></label>
        <label class="checkbox-label"><input type="checkbox" id="pw-ambiguous" /> <span>მსგავსი სიმბოლოების გამორიცხვა (I, l, 1, O, 0)</span></label>
      </div>

      <ul id="pw-list" class="file-list hidden"></ul>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/core.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      const { generatePassword } = window.GeoCore;
      const { initLayout, copyToClipboard, escapeHtml } = window.GeoCommon;

      initLayout('password-generator');

      const out = document.getElementById('pw-output');
      const bar = document.getElementById('pw-bar');
      const strengthEl = document.getElementById('pw-strength');
      const errorBox = document.getElementById('pw-error');
      const lengthInput = document.getElementById('pw-length');
      const lengthVal = document.getElementById('pw-length-val');
      const countSel = document.getElementById('pw-count');
      const list = document.getElementById('pw-list');
      const checks = {
        lower: document.getElementById('pw-lower'),
        upper: document.getElementById('pw-upper'),
        digits: document.getElementById('pw-digits'),
        symbols: document.getElementById('pw-symbols'),
        excludeAmbiguous: document.getElementById('pw-ambiguous')
      };
      let current = '';

      function options() {
        return {
          length: Number(lengthInput.value),
          lower: checks.lower.checked,
          upper: checks.upper.checked,
          digits: checks.digits.checked,
          symbols: checks.symbols.checked,
          excludeAmbiguous: checks.excludeAmbiguous.checked
        };
      }

      function generate() {
        errorBox.classList.add('hidden');
        lengthVal.textContent = lengthInput.value;
        try {
          const res = generatePassword(options());
          current = res.password;
          out.textContent = res.password;
          const pct = Math.min(100, Math.round(res.entropyBits / 128 * 100));
          bar.style.width = pct + '%';
          bar.style.background = res.entropyBits >= 75 ? 'var(--success)' : (res.entropyBits >= 50 ? 'var(--warning)' : 'var(--danger, #dc2626)');
          strengthEl.textContent = 'სიძლიერე: ' + res.strength + ' (~' + res.entropyBits + ' ბიტი ენტროპია)';

          const count = Number(countSel.value);
          if (count > 1) {
            const extra = [res.password];
            for (let i = 1; i < count; i++) extra.push(generatePassword(options()).password);
            list.innerHTML = extra.map(function (p) {
              return '<li class="file-list-item"><code style="word-break: break-all;">' + escapeHtml(p) + '</code>' +
                '<button type="button" class="btn btn-secondary btn-sm" data-pw="' + escapeHtml(p) + '">კოპირება</button></li>';
            }).join('');
            list.classList.remove('hidden');
          } else {
            list.innerHTML = '';
            list.classList.add('hidden');
          }
        } catch (err) {
          current = '';
          out.textContent = '-';
          bar.style.width = '0';
          strengthEl.textContent = '-';
          errorBox.textContent = err.message;
          errorBox.classList.remove('hidden');
        }
      }

      list.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-pw]');
        if (btn) copyToClipboard(btn.getAttribute('data-pw'), 'პაროლი დაკოპირდა!', btn);
      });
      lengthInput.addEventListener('input', generate);
      countSel.addEventListener('change', generate);
      Object.keys(checks).forEach(function (k) { checks[k].addEventListener('change', generate); });
      document.getElementById('btn-pw-new').addEventListener('click', generate);
      document.getElementById('btn-pw-copy').addEventListener('click', function () {
        copyToClipboard(current, 'პაროლი დაკოპირდა!');
      });
      generate();
    })();
  </script>
</body>
</html>
