<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mokled - მოკლედ | ქართული ციფრული ხელსაწყოების პორტალი</title>
  <meta name="description" content="Mokled (მოკლედ) - 12 უფასო ქართული ციფრული ხელსაწყო: ტექსტის კონვერტერი, სესხის კალკულატორი, PDF ხელსაწყოები, საფოსტო ინდექსები, თანხა სიტყვიერად, ხელფასისა და დღგ-ის კალკულატორი, IBAN, QR კოდი და სურათის შეკუმშვა." />
  <link rel="canonical" href="https://mokled.pages.dev/" />
  <meta property="og:title" content="Mokled - მოკლედ | ქართული ციფრული ხელსაწყოების პორტალი" />
  <meta property="og:description" content="სწრაფი, უსაფრთხო და უფასო ქართული ონლაინ ხელსაწყოები რეალური ამოცანების მოკლედ და მარტივად გადასაჭრელად." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mokled.pages.dev/" />
  <meta property="og:locale" content="ka_GE" />
  <meta property="og:image" content="https://mokled.pages.dev/assets/logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <section class="hero">
      <h1>Mokled - მოკლედ</h1>
      <p>
        ქართული ციფრული ხელსაწყოების პორტალი ყოველდღიური ტექსტური, ფინანსური, საოფისე და PDF/მედია ამოცანების სწრაფად გადასაჭრელად.
        რეგისტრაციის გარეშე - მუშაობს პირდაპირ თქვენს ბრაუზერში.
      </p>
      <div class="filter-bar">
        <div class="category-pills" id="category-pills" role="group" aria-label="კატეგორიები"></div>
      </div>
    </section>

    <!-- რჩეული ხელსაწყოები (⭐ ვარსკვლავით მონიშნული) -->
    <section id="favorites-section" class="hidden">
      <div class="section-header">
        <h2 class="section-title">⭐ რჩეული ხელსაწყოები</h2>
      </div>
      <div class="cards-grid" id="favorites-grid"></div>
    </section>

    <!-- ხშირად გამოყენებული ხელსაწყოები -->
    <section id="frequent-section" class="hidden">
      <div class="section-header">
        <h2 class="section-title">თქვენ მიერ ხშირად გამოყენებული</h2>
        <button type="button" id="reset-frequent-btn" class="btn btn-secondary btn-sm">ისტორიის გასუფთავება</button>
      </div>
      <div class="cards-grid" id="frequent-grid"></div>
    </section>

    <!-- ყველა ხელსაწყო -->
    <section>
      <div class="section-header">
        <h2 class="section-title">ყველა ხელსაწყო</h2>
        <span id="tools-count" class="badge">12 ხელსაწყო</span>
      </div>
      <div class="cards-grid" id="catalog-grid"></div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/core.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      const {
        TOOLS_CATALOG,
        initLayout,
        getUsageCounts,
        resetUsageCounts,
        getFavorites,
        toggleFavorite,
        escapeHtml,
        showToast
      } = window.GeoCommon;

      initLayout('home');

      const pillsContainer = document.getElementById('category-pills');
      const catalogGrid = document.getElementById('catalog-grid');
      const toolsCount = document.getElementById('tools-count');
      const favoritesSection = document.getElementById('favorites-section');
      const favoritesGrid = document.getElementById('favorites-grid');
      const frequentSection = document.getElementById('frequent-section');
      const frequentGrid = document.getElementById('frequent-grid');
      const resetFrequentBtn = document.getElementById('reset-frequent-btn');

      let activeCategory = 'ყველა';
      const categories = ['ყველა'].concat(Array.from(new Set(TOOLS_CATALOG.map(function (t) { return t.category; }))));

      function renderCategories() {
        pillsContainer.innerHTML = categories.map(function (cat) {
          return '<button type="button" class="pill-btn ' + (cat === activeCategory ? 'active' : '') + '" data-cat="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</button>';
        }).join('');

        pillsContainer.querySelectorAll('.pill-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            activeCategory = btn.getAttribute('data-cat');
            renderCategories();
            renderAllSections();
          });
        });
      }

      function createCardHtml(tool, usageCount, favList) {
        const count = usageCount || 0;
        const isFav = favList.indexOf(tool.id) >= 0;
        const usageBadge = count > 0
          ? '<span class="badge">გახსნილია ' + count + '-ჯერ</span>'
          : '<span class="badge">' + escapeHtml(tool.category) + '</span>';

        return (
          '<a href="' + tool.url + '" class="tool-card">' +
            '<div>' +
              '<div class="card-top">' +
                '<span class="tool-icon" aria-hidden="true">' + escapeHtml(tool.icon) + '</span>' +
                '<div class="card-badges">' +
                  usageBadge +
                  '<button type="button" class="fav-btn ' + (isFav ? 'active' : '') + '" data-fav-id="' + escapeHtml(tool.id) + '" title="რჩეულებში დამატება / მოხსნა" aria-label="რჩეულებში დამატება">' +
                    (isFav ? '★' : '☆') +
                  '</button>' +
                '</div>' +
              '</div>' +
              '<h3>' + escapeHtml(tool.title) + '</h3>' +
              '<p>' + escapeHtml(tool.description) + '</p>' +
            '</div>' +
            '<span class="card-action">ხელსაწყოს გახსნა →</span>' +
          '</a>'
        );
      }

      function bindFavButtons(container) {
        container.querySelectorAll('.fav-btn').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            const id = btn.getAttribute('data-fav-id');
            const added = toggleFavorite(id);
            showToast(added ? 'დაემატა რჩეულ ხელსაწყოებში ⭐' : 'მოიხსნა რჩეულებიდან');
            renderAllSections();
          });
        });
      }

      function renderAllSections() {
        const favList = getFavorites();
        const counts = getUsageCounts();

        const favTools = TOOLS_CATALOG.filter(function (t) { return favList.indexOf(t.id) >= 0; });
        if (favTools.length === 0) {
          favoritesSection.classList.add('hidden');
        } else {
          favoritesSection.classList.remove('hidden');
          favoritesGrid.innerHTML = favTools.map(function (t) { return createCardHtml(t, counts[t.id], favList); }).join('');
          bindFavButtons(favoritesGrid);
        }

        const usedTools = TOOLS_CATALOG
          .filter(function (t) { return (counts[t.id] || 0) > 0; })
          .sort(function (a, b) { return (counts[b.id] || 0) - (counts[a.id] || 0); })
          .slice(0, 3);

        if (usedTools.length === 0) {
          frequentSection.classList.add('hidden');
        } else {
          frequentSection.classList.remove('hidden');
          frequentGrid.innerHTML = usedTools.map(function (t) { return createCardHtml(t, counts[t.id], favList); }).join('');
          bindFavButtons(frequentGrid);
        }

        const filtered = TOOLS_CATALOG.filter(function (tool) {
          return activeCategory === 'ყველა' || tool.category === activeCategory;
        });

        toolsCount.textContent = filtered.length + ' ხელსაწყო';
        catalogGrid.innerHTML = filtered.map(function (t) { return createCardHtml(t, 0, favList); }).join('');
        bindFavButtons(catalogGrid);
      }

      resetFrequentBtn.addEventListener('click', function () {
        resetUsageCounts();
        renderAllSections();
        showToast('ხშირად გამოყენებული ხელსაწყოების ისტორია გასუფთავდა.');
      });

      renderCategories();
      renderAllSections();
    })();
  </script>
</body>
</html>
